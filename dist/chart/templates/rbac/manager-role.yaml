apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "vates-capi.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - clusters/status
  - machinedeployments
  - machinedeployments/status
  - machines
  - machines/status
  - machinesets
  - machinesets/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vates.infrastructure.cluster.x-k8s.io
  resources:
  - vatesclusters
  - vatesclustertemplates
  - vatesmachines
  - vatesmachinetemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vates.infrastructure.cluster.x-k8s.io
  resources:
  - vatesclusters/finalizers
  - vatesmachines/finalizers
  verbs:
  - update
- apiGroups:
  - vates.infrastructure.cluster.x-k8s.io
  resources:
  - vatesclusters/status
  - vatesmachines/status
  verbs:
  - get
  - patch
  - update
