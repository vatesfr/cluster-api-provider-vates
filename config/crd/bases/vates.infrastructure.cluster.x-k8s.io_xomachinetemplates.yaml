---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: xomachinetemplates.vates.infrastructure.cluster.x-k8s.io
spec:
  group: vates.infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: XOMachineTemplate
    listKind: XOMachineTemplateList
    plural: xomachinetemplates
    singular: xomachinetemplate
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: XOMachineTemplate is the Schema for the xomachinetemplates API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: XOMachineTemplateSpec defines the desired state of XOMachineTemplate.
            properties:
              template:
                description: XOMachineTemplateResource describes the data needed to
                  create a XOMachine from a template.
                properties:
                  spec:
                    description: Spec is the specification of the desired behavior
                      of the machine.
                    properties:
                      bootstrap:
                        description: |-
                          Bootstrap declares how the bootstrap payload from the owner Machine must
                          be handled by the infrastructure provider. It describes what to do, never
                          who produced the payload, so adding a bootstrap provider needs no change
                          to this controller. When unset, the payload is passed through untouched.
                        properties:
                          cloudInit:
                            description: |-
                              CloudInit is deprecated and will be removed in v1.2; use Format instead.

                              Deprecated: set Format to "cloudinit". Kept for backward compatibility:
                              when Format is empty and CloudInit is true, the payload is treated as
                              cloud-init.
                            type: boolean
                          format:
                            description: |-
                              Format is the format of the bootstrap payload, and therefore how the
                              infrastructure provider may treat it:

                                - "passthrough" (default): deliver the payload untouched. Use it for
                                  any bootstrap provider whose payload must not be interpreted, e.g.
                                  Talos.
                                - "cloudinit": the payload is a cloud-init document, which may be
                                  enriched: the XO user's SSH keys are merged in when the cluster sets
                                  injectSSHKeys, and kube-vip is injected when the cluster sets
                                  controlPlaneLB: kube-vip and the machine is a control plane node.

                              An empty value is treated as "passthrough".
                            enum:
                            - passthrough
                            - cloudinit
                            type: string
                          kubeVIP:
                            description: |-
                              KubeVIP is deprecated and will be removed in v1.2; it has no effect.

                              Deprecated: kube-vip injection is driven by the cluster policy
                              (XOCluster.spec.controlPlaneLB: kube-vip) and the machine role, not by
                              this flag.
                            type: boolean
                        type: object
                      bootstrapData:
                        description: |-
                          BootstrapData is the bootstrap data to inject into the VM.
                          If empty, the controller will try to read it from the owner Machine's bootstrap secret.
                        type: string
                      bootstrapProvider:
                        description: |-
                          BootstrapProvider identifies the bootstrap provider for observability
                          only: it is applied as the "bootstrap:<name>" tag on the VM. It does not
                          change how the payload is handled -- declare Bootstrap for that.
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      failureDomain:
                        description: FailureDomain is the failure domain unique identifier
                          this Machine should be attached to, as defined in ClusterStatus.FailureDomains.
                        type: string
                      identityRef:
                        description: |-
                          IdentityRef is a reference to a Secret containing XO credentials.
                          The Secret must contain 'url' and 'token' data keys, and optionally
                          'insecure'. The Secret must be in the same namespace as the XOMachine.
                          If not set, falls back to the XOCluster's identityRef, then the
                          controller's global credentials.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      namePrefix:
                        description: NamePrefix is the prefix for the VM name.
                        type: string
                      networkConfig:
                        description: NetworkConfig specifies the network configuration
                          for the VM.
                        properties:
                          addressesFromPools:
                            description: |-
                              AddressesFromPools asks Cluster API's IPAM integration for an address for
                              this machine, from the pools named here. It is the standard spelling:
                              an IPAddressClaim is created from each pool, an IPAM provider answers with
                              an IPAddress, and the address is rendered into the guest's network
                              configuration as a netplan document -- so the node boots on an address the
                              provider chose rather than on whatever a DHCP server happens to hand out.

                              A control plane's identity is tied to its address -- etcd records the peer
                              URL it joined with -- which is why this exists: a lease that can move is a
                              control plane that can be lost on the next reboot.

                              When set, it wins over GuestConfig: the pool is the answer to "which
                              address", and there is only one answer.
                            items:
                              description: IPPoolReference is a reference to an IPPool.
                              properties:
                                apiGroup:
                                  description: |-
                                    apiGroup of the IPPool.
                                    apiGroup must be fully qualified domain name.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                  type: string
                                kind:
                                  description: |-
                                    kind of the IPPool.
                                    kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
                                  maxLength: 63
                                  minLength: 1
                                  pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                                  type: string
                                name:
                                  description: |-
                                    name of the IPPool.
                                    name must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                  type: string
                              required:
                              - apiGroup
                              - kind
                              - name
                              type: object
                            type: array
                          allowedIPRange:
                            description: |-
                              AllowedIPRange is a CIDR range of IPs allowed to access the VM (e.g. "10.30.139.0/24").
                              Applied to all VIFs on the VM. If empty, no IP restriction is set.
                            type: string
                          guestConfig:
                            description: |-
                              GuestConfig is the cloud-init network configuration (netplan format) to apply inside the VM.
                              This is passed directly to XO via the NetworkConfig field of CreateVM, allowing the guest
                              OS to receive a static IP or custom network setup before the first boot.
                              Example (netplan v2):
                                version: 2
                                ethernets:
                                  eth0:
                                    dhcp4: false
                                    addresses:
                                      - 10.30.139.10/16
                                    gateway4: 10.30.0.1
                            type: string
                          networks:
                            description: Networks is a list of networks to attach
                              to the VM.
                            items:
                              properties:
                                name:
                                  description: Name is the XO network name to attach
                                    (alternative to NetworkID).
                                  type: string
                                networkID:
                                  description: NetworkID is the XO network UUID to
                                    attach.
                                  type: string
                              type: object
                            type: array
                        type: object
                      poolID:
                        description: |-
                          PoolID is the Xen Orchestra pool UUID where the VM will be created.
                          If empty, the controller will use the template's pool.
                        type: string
                      poolName:
                        description: |-
                          PoolName is the Xen Orchestra pool name where the VM will be created
                          (alternative to PoolID).
                        type: string
                      providerID:
                        description: |-
                          ProviderID is the Xen Orchestra provider ID (e.g. xenorchestra://pool-uuid/vm-uuid).
                          Set by the controller after the VM is created.
                        type: string
                      resourceSet:
                        description: ResourceSet is the resource set configuration
                          for the VM (CPU, RAM, disk).
                        properties:
                          cpus:
                            description: CPUs is the number of vCPUs.
                            format: int32
                            minimum: 1
                            type: integer
                          diskSize:
                            description: DiskSize is the disk size allocated to the
                              VM in Kubernetes resource format (e.g. "30Gi", "50G").
                            type: string
                          memory:
                            description: Memory is the memory allocated to the VM
                              in Kubernetes resource format (e.g. "8Gi", "8192Mi").
                            type: string
                        type: object
                      tags:
                        description: |-
                          Tags are additional Xen Orchestra tags applied to the VM, on top of the
                          identifying tags set by the controller (vates-capi, cluster-name:<name>,
                          machine:<name>, role:<role>, bootstrap:<name>) and of the cluster-wide
                          XOCluster spec.tags. Tags are only added: removing a tag from this list
                          does not remove it from an existing VM.
                        items:
                          maxLength: 255
                          minLength: 1
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                      templateID:
                        description: TemplateID is the XO VM template UUID to clone.
                        type: string
                      templateName:
                        description: TemplateName is the XO VM template name to clone
                          (alternative to TemplateID).
                        type: string
                    required:
                    - namePrefix
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
          status:
            description: XOMachineTemplateStatus defines the observed state of XOMachineTemplate.
            type: object
        required:
        - metadata
        type: object
    served: true
    storage: true
