# It should be run by config/default
resources:
- bases/vates.infrastructure.cluster.x-k8s.io_vatesmachines.yaml
- bases/vates.infrastructure.cluster.x-k8s.io_vatesclusters.yaml
- bases/vates.infrastructure.cluster.x-k8s.io_vatesmachinetemplates.yaml
- bases/vates.infrastructure.cluster.x-k8s.io_vatesclustertemplates.yaml
