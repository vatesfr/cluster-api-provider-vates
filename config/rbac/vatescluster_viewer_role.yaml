# This rule is not used by the project vates-capi itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to vates.infrastructure.cluster.x-k8s.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vates-capi
    app.kubernetes.io/managed-by: kustomize
  name: vatescluster-viewer-role
rules:
- apiGroups:
  - vates.infrastructure.cluster.x-k8s.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vates.infrastructure.cluster.x-k8s.io
  resources:
  - clusters/status
  verbs:
  - get
