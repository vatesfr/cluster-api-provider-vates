apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: rhel-from-scratch-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            certSANs:
              - localhost
              - 127.0.0.1
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: cgroup-driver
                value: systemd
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              - name: cgroup-driver
                value: systemd
        preKubeadmCommands:
          - |
            IP=$(hostname -I | awk '{print $1}')
            hostnamectl set-hostname "cp-${IP//./-}"
          - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
          - modprobe overlay; modprobe br_netfilter
          - |
            printf 'net.bridge.bridge-nf-call-iptables  = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward                 = 1\nnet.ipv4.conf.all.rp_filter         = 0\nnet.ipv4.conf.eth0.rp_filter        = 0\n' > /etc/sysctl.d/k8s.conf
          - sysctl --system
          - swapoff -a; sed -i '/ swap /d' /etc/fstab 2>/dev/null; true
          - dnf install -y epel-release
          - dnf install -y containerd xe-guest-utilities-latest
          - containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | tee /etc/containerd/config.toml
          - systemctl enable --now containerd
          - systemctl enable --now xe-linux-distribution
          - |
            for f in /run/kubeadm/kubeadm.yaml /run/kubeadm/kubeadm-join-config.yaml; do
              [ -f "$f" ] && FULL=$(grep 'kubernetesVersion:' "$f" | awk '{print $2}') && break
            done
            [ -z "$FULL" ] && FULL="v1.36.0"
            MINOR=$(echo "$FULL" | sed 's/\(v[0-9]*\.[0-9]*\).*/\1/')
            cat <<EOF > /etc/yum.repos.d/kubernetes.repo
            [kubernetes]
            name=Kubernetes
            baseurl=https://pkgs.k8s.io/core:/stable:/${MINOR}/rpm/
            enabled=1
            gpgcheck=1
            gpgkey=https://pkgs.k8s.io/core:/stable:/${MINOR}/rpm/repodata/repomd.xml.key
            EOF
          - dnf install -y kubelet kubeadm kubectl --disableexcludes=kubernetes
          - systemctl enable kubelet
          - kubeadm config images pull || true
        # postKubeadmCommands are injected via ClusterClass patches (calicoPatch)
        # kube-vip commands are injected by the controller into cloud-init
        postKubeadmCommands:
          - "true"
      machineTemplate:
        metadata:
          labels: {}
