apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: vates-rhel-from-scratch
spec:
  variables:
    - name: controlPlaneEndpoint
      required: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
              default: 6443
          required:
            - host
    - name: vmNamePrefix
      required: true
      schema:
        openAPIV3Schema:
          type: string
    - name: use-kubevip
      required: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            enabled:
              type: boolean
  patches:
    - name: controlPlaneEndpointPatch
      definitions:
        - selector:
            apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VatesClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                variable: controlPlaneEndpoint
    - name: cpNamePrefixPatch
      definitions:
        - selector:
            apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VatesMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/namePrefix
              valueFrom:
                template: '{{ .vmNamePrefix }}-cp'
    - name: workerNamePrefixPatch
      definitions:
        - selector:
            apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VatesMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - worker-from-scratch
                  - worker-prefilled
          jsonPatches:
            - op: replace
              path: /spec/template/spec/namePrefix
              valueFrom:
                template: '{{ .vmNamePrefix }}-worker'
    - name: workerArpingPatch
      definitions:
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - worker-from-scratch
                  - worker-prefilled
          jsonPatches:
            - op: add
              path: /spec/template/spec/preKubeadmCommands/-
              valueFrom:
                template: arping -I eth0 -c 3 {{ .controlPlaneEndpoint.host }} 2>/dev/null || true
    - name: kubevipPatch
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/certSANs/-
              valueFrom:
                variable: controlPlaneEndpoint.host
        - selector:
            apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VatesClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubevip
              valueFrom:
                variable: use-kubevip
    - name: calicoPatch
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/postKubeadmCommands/-
              valueFrom:
                template: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://127.0.0.1:6443 apply --validate=false -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.0/manifests/calico.yaml && kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://127.0.0.1:6443 patch ds -n kube-system calico-node --type json -p='[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"IP_AUTODETECTION_METHOD","value":"kubernetes-internal-ip"}},{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"IP6_AUTODETECTION_METHOD","value":"kubernetes-internal-ip"}}]' && kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://127.0.0.1:6443 rollout status -n kube-system ds/calico-node --timeout=120s
  infrastructure:
    templateRef:
      apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
      kind: VatesClusterTemplate
      name: rhel-cluster
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: rhel-from-scratch-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
        kind: VatesMachineTemplate
        name: rhel-cp-from-scratch
  workers:
    machineDeployments:
      - class: worker-from-scratch
        healthCheck:
          checks:
            nodeStartupTimeoutSeconds: 600
            unhealthyNodeConditions:
              - type: Ready
                status: "False"
                timeoutSeconds: 300
              - type: Ready
                status: Unknown
                timeoutSeconds: 300
          remediation:
            maxInFlight: 1
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: rhel-from-scratch-worker
        infrastructure:
          templateRef:
            apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VatesMachineTemplate
            name: rhel-worker-from-scratch
      - class: worker-prefilled
        healthCheck:
          checks:
            nodeStartupTimeoutSeconds: 600
            unhealthyNodeConditions:
              - type: Ready
                status: "False"
                timeoutSeconds: 300
              - type: Ready
                status: Unknown
                timeoutSeconds: 300
          remediation:
            maxInFlight: 1
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: rhel-prefilled-worker
        infrastructure:
          templateRef:
            apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VatesMachineTemplate
            name: rhel-worker-prefilled