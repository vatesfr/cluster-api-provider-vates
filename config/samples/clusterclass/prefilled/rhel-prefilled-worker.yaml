apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: rhel-prefilled-worker
spec:
  template:
    spec:
      preKubeadmCommands:
        - |
          IP=$(hostname -I | awk '{print $1}')
          hostnamectl set-hostname "worker-${IP//./-}"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: cgroup-driver
              value: systemd
