# Documentation for cluster-api-provider-vates.
#
# This file is a standard mkdocs.yml, so the site can be built either with
# Zensical (`zensical build`) or, as a fallback, with MkDocs Material
# (`mkdocs build`). We ship on Zensical, the successor to Material for MkDocs.

site_name: vates-capi
site_url: https://vates-capi.readthedocs.io/
site_description: A Cluster API infrastructure provider for Xen Orchestra and XCP-ng.
site_author: Vates

repo_url: https://github.com/vatesfr/cluster-api-provider-vates
repo_name: vatesfr/cluster-api-provider-vates
edit_uri: edit/main/docs/

copyright: >
  &copy; 2026 Vates &mdash; Licensed under the Apache License, Version 2.0

theme:
  # `material` is the theme MkDocs knows; Zensical renders it with its
  # `classic` variant, which keeps the Material for MkDocs look.
  name: material
  variant: classic
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Concept:
      - concept/index.md
      - Cluster API in a nutshell: concept/cluster-api.md
      - The three providers: concept/providers.md
      - How they fit together: concept/how-they-link.md
      - Where Vates CAPI fits: concept/vates-provider.md
  - Getting started:
      - getting-started/prerequisites.md
      - getting-started/installation.md
      - getting-started/quickstart.md
      - "Tutorial: a cluster from A to Z":
          - Preparation: getting-started/tutorial/preparation.md
          - The objects: getting-started/tutorial/cluster.md
          - Apply and run: getting-started/tutorial/run.md
  - Guides:
      - Providers:
          - kubeadm: guides/providers/kubeadm.md
          - Vates Kube OS: guides/providers/vates-kube-os.md
          - Talos:
              - guides/providers/talos/index.md
              - guides/providers/talos/prerequisites.md
              - guides/providers/talos/installation.md
              - guides/providers/talos/cluster.md
      - guides/clusterclass.md
      - guides/vm-naming.md
      - guides/networking.md
      - guides/ipam.md
      - guides/vip.md
      - guides/ssh-keys.md
  - Reference:
      - reference/index.md
      - Custom resources:
          - reference/crds/index.md
          - reference/crds/xocluster.md
          - reference/crds/xoclustertemplate.md
          - reference/crds/xomachine.md
          - reference/crds/xomachinetemplate.md
      - Bootstrap payload: reference/bootstrap.md
      - Cluster templates: reference/templates.md
  - Operations:
      - operations/upgrading.md
      - operations/troubleshooting.md
      - operations/releasing.md
  - Contributing:
      - contributing/architecture.md
      - contributing/development.md
      - contributing/testing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
