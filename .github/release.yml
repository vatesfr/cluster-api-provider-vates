# Configuration of the automatically generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Pull requests are grouped by label. The labels are applied automatically from
# the conventional-commit prefix of the PR title by the "PR labels" workflow.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - renovate
  categories:
    - title: "⚠️ Breaking changes"
      labels:
        - breaking
    - title: "🚀 Features"
      labels:
        - feat
    - title: "🐛 Bug fixes"
      labels:
        - fix
    - title: "📚 Documentation"
      labels:
        - docs
    - title: "🧹 Maintenance"
      labels:
        - chore
        - refactor
        - build
        - ci
        - test
    - title: "Other changes"
      labels:
        - "*"
