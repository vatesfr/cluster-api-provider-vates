# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      - name: Create dummy XO credentials secret
        run: |
          kubectl create ns vates-capi-system 2>/dev/null || true
          kubectl create secret generic xo-credentials -n vates-capi-system \
            --from-literal=url=https://dummy.xo.local \
            --from-literal=token=dummy-token \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manager via Helm
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status

  chart-up-to-date:
    permissions:
      contents: read
    name: Chart is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install Helm
        run: make install-helm

      - name: Regenerate the Helm chart
        run: make helm-update-chart

      - name: Fail if the committed chart is stale
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Run 'make helm-update-chart' and commit the result."
            exit 1
          fi
