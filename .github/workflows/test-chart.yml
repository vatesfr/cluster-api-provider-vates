name: Test Chart

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare vates-capi
        run: |
          go mod tidy
          make docker-build CONTAINER_TOOL=docker
          docker save $IMG -o /tmp/vates-capi.tar
          kind load image-archive /tmp/vates-capi.tar

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart

      - name: Render chart with extra args/envs/volumes
        run: |
          helm template vates-capi ./dist/chart \
            --set-json 'manager.extraArgs=["--kubeconfig=/etc/kubeconfig/config"]' \
            --set-json 'manager.extraEnvs=[{"name":"KUBECONFIG","value":"/etc/kubeconfig/config"}]' \
            --set-json 'manager.extraVolumes=[{"name":"kubeconfig","secret":{"secretName":"my-kubeconfig"}}]' \
            --set-json 'manager.extraVolumeMounts=[{"name":"kubeconfig","mountPath":"/etc/kubeconfig","readOnly":true}]' \
            > /tmp/rendered-chart.yaml
          grep -q -- '--kubeconfig=/etc/kubeconfig/config' /tmp/rendered-chart.yaml
          grep -q -- 'KUBECONFIG' /tmp/rendered-chart.yaml
          grep -q -- 'my-kubeconfig' /tmp/rendered-chart.yaml

# TODO: Uncomment if cert-manager is enabled
