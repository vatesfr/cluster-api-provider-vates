# Lets every node read events, which the dashboard on its console shows and a
# node may not read otherwise (the Node authorizer stops at its own Node and
# pods). Events cannot be narrowed to one node's, so the grant is read access
# to events cluster-wide: a deliberate, read-only widening. Bound to the
# system:nodes group, so it holds whatever the nodes are named.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vates:node-dashboard
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vates:node-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vates:node-dashboard
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:nodes
