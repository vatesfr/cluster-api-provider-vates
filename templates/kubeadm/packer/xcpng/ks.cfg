# AlmaLinux 10 for the XCP-ng build (../almalinux-10-k8s-xcpng.pkr.hcl): as
# close as a kickstart gets to the GenericCloud image the QEMU build starts
# from. Everything Kubernetes is left to the provisioners.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate
repo --name=AppStream --baseurl=file:///run/install/repo/AppStream

# eth0, as in the cloud image: the sysctls and the cluster templates name it.
bootloader --append="net.ifnames=0 biosdevname=0"

# No swap (kubelet); / last, so cloud-init can grow it on a larger clone.
ignoredisk --only-use=xvda
zerombr
clearpart --all --initlabel
part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype=xfs --size=1024
part / --fstype=xfs --size=4096 --grow

# The cloud image has no firewall; kubeadm and the CNI expect none.
firewall --disabled
selinux --enforcing
firstboot --disable
rootpw --lock
# Packer's user. install-k8s.sh locks its password at the end.
user --name=almalinux --groups=wheel --password=packer --plaintext

%packages
@^minimal-environment
cloud-init
cloud-utils-growpart
%end

# --erroronfail: a failed %post stops the install on the console, instead of
# a system without guest tools whose IP Packer waits for until it times out.
%post --erroronfail --log=/root/ks-post.log
set -e
echo 'almalinux ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/almalinux
chmod 0440 /etc/sudoers.d/almalinux
# The guest tools report the IP Packer connects to (ip_getter = "tools").
dnf install -y epel-release
dnf install -y xe-guest-utilities-latest
systemctl enable xe-linux-distribution
# The installer's connection names the installer's interface (enX0); with
# eth0 on the installed system, cloud-init writes the network instead.
rm -f /etc/NetworkManager/system-connections/*.nmconnection
%end

reboot
