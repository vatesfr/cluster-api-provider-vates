# TalosConfigTemplate (CABPT) for worker bootstrap
# Requires: clusterctl init --bootstrap talos --control-plane talos
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: talos-worker
  namespace: default
spec:
  template:
    spec:
      generateType: join
      strategicPatches:
        - |
          machine:
            time:
              servers:
                - time.cloudflare.com
                - pool.ntp.org
        # kubelet is a standalone document since Talos 1.12: patching
        # machine.kubelet here makes the whole config invalid
        # ("kubelet config is already set in v1alpha1 config").
        - |
          apiVersion: v1alpha1
          kind: KubeletConfig
          extraArgs:
            cloud-provider: external
