# XOMachineTemplate for Talos worker nodes
#
# Replace the placeholders with your XO environment values:
#   templateID: UUID of your Talos nocloud template (viridian=false)
#   poolID:     UUID of your XO pool
#   networkID:  UUID of your XO network
apiVersion: vates.infrastructure.cluster.x-k8s.io/v1beta2
kind: XOMachineTemplate
metadata:
  name: talos-worker
  namespace: default
spec:
  template:
    spec:
      bootstrapProvider: talos
      namePrefix: talos-worker
      templateID: <your-xo-talos-template-uuid>
      poolID: <your-xo-pool-uuid>
      resourceSet:
        cpus: 4
        memory: 8Gi
        diskSize: 40Gi
      networkConfig:
        networks:
          - networkID: <your-xo-network-uuid>